<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shipping Israel</title>
  </head>
  <body>
    <main id="dp">
      <div id="centerCol">
        <div id="title_feature_div" class="celwidget"><h1>Gildan T-Shirt</h1></div>
        <div id="apex_desktop" class="celwidget">
          <div id="corePrice_desktop">
            <span class="a-price-whole">20</span>
            <span class="savingsPercentage">-9%</span>
          </div>
        </div>
        <div
          id="amazonGlobal_feature_div"
          class="celwidget"
          data-feature-name="amazonGlobal"
        >
          <span class="a-size-base a-color-secondary">
            No Import Charges &amp; $18.87 Shipping to Israel
          </span>
          <span class="a-declarative" data-action="a-popover">
            <a href="javascript:void(0)" role="button" class="a-popover-trigger a-declarative">
              <span class="a-size-base">Details</span>
            </a>
          </span>
          <div class="a-popover-preload" id="a-popover-NEW_0" hidden>
            <h3>Shipping &amp; Fee Details</h3>
            <table class="a-lineitem">
              <tr>
                <td>
                  <span class="a-size-base a-color-secondary">Price</span>
                </td>
                <td>
                  <span class="a-size-base a-color-base">$17.99</span>
                </td>
              </tr>
              <tr>
                <td>
                  <span class="a-size-base a-color-secondary">AmazonGlobal Shipping</span>
                </td>
                <td>
                  <span class="a-size-base a-color-base">$18.87</span>
                </td>
              </tr>
              <tr>
                <td>
                  <span class="a-size-base a-color-secondary">Estimated Import Charges</span>
                </td>
                <td>
                  <span class="a-size-base a-color-base">$0.00</span>
                </td>
              </tr>
              <tr>
                <td>
                  <span class="a-size-base a-color-secondary">Total</span>
                </td>
                <td>
                  <span class="a-size-base a-color-base">$36.86</span>
                </td>
              </tr>
            </table>
          </div>
        </div>
        <div id="unrelated1" class="celwidget"></div>
        <div id="unrelated2" class="celwidget">
          <span class="a-size-base a-color-secondary">noise label</span>
        </div>
      </div>
    </main>
  </body>
</html>
