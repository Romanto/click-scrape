<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Twister dimensions</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 1.5rem; background: #fff; color: #111; }
      .dimension-values-list { display: flex; gap: 8px; list-style: none; padding: 0; }
      .text-swatch-button { display: inline-block; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; }
      .a-button-selected { border-color: #111; font-weight: 700; }
    </style>
  </head>
  <body>
    <main id="dp">
      <div id="centerCol">
        <div id="tp-inline-twister-dim-values-container">
          <div id="inline-twister-row-number_of_items" class="celwidget inline-twister-row">
            <div class="dimension-heading">
              <span class="a-size-base a-color-secondary">Number of Items:</span>
              <span class="a-size-base a-text-bold">5</span>
            </div>
            <ul class="a-unordered-list a-button-list dimension-values-list" role="radiogroup">
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="number_of_items_0" class="a-button a-button-selected a-button-toggle text-swatch-button">
                  <span id="number_of_items_0-announce" class="a-button-text">
                    <span class="swatch-title-text-display">5</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="number_of_items_1" class="a-button a-button-toggle a-button-unavailable text-swatch-button">
                  <span id="number_of_items_1-announce" class="a-button-text">
                    <span class="swatch-title-text-display">6</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="number_of_items_2" class="a-button a-button-toggle a-button-unavailable text-swatch-button">
                  <span id="number_of_items_2-announce" class="a-button-text">
                    <span class="swatch-title-text-display">10</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="number_of_items_3" class="a-button a-button-toggle a-button-unavailable text-swatch-button">
                  <span id="number_of_items_3-announce" class="a-button-text">
                    <span class="swatch-title-text-display">12</span>
                  </span>
                </span>
              </li>
            </ul>
          </div>
          <div id="inline-twister-row-size_name" class="celwidget inline-twister-row">
            <div class="dimension-heading">
              <span class="a-size-base a-color-secondary">Size:</span>
              <span class="a-size-base a-text-bold">Medium</span>
            </div>
            <ul class="a-unordered-list a-button-list dimension-values-list" role="radiogroup">
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="size_name_0" class="a-button a-button-toggle text-swatch-button">
                  <span id="size_name_0-announce" class="a-button-text">
                    <span class="swatch-title-text-display">Small</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="size_name_1" class="a-button a-button-selected a-button-toggle text-swatch-button">
                  <span id="size_name_1-announce" class="a-button-text">
                    <span class="swatch-title-text-display">Medium</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="size_name_2" class="a-button a-button-toggle text-swatch-button">
                  <span id="size_name_2-announce" class="a-button-text">
                    <span class="swatch-title-text-display">Large</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="size_name_3" class="a-button a-button-toggle text-swatch-button">
                  <span id="size_name_3-announce" class="a-button-text">
                    <span class="swatch-title-text-display">X-Large</span>
                  </span>
                </span>
              </li>
              <li class="swatch-list-item-text inline-twister-swatch">
                <span id="size_name_4" class="a-button a-button-toggle text-swatch-button">
                  <span id="size_name_4-announce" class="a-button-text">
                    <span class="swatch-title-text-display">XX-Large</span>
                  </span>
                </span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
