<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Price and discount</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 1.5rem; background: #fff; color: #111; }
      .a-price { font-size: 1.25rem; font-weight: 700; }
      .savings { color: #b12704; }
      .celwidget { margin: 4px 0; }
    </style>
  </head>
  <body>
    <main id="dp">
      <div id="centerCol">
        <div id="title_feature_div" class="celwidget"><h1>Gildan T-Shirt</h1></div>
        <div id="bylineInfo_feature_div" class="celwidget"></div>
        <div id="averageCustomerReviews_feature_div" class="celwidget"></div>
        <div id="apex_desktop" class="celwidget">
          <div id="corePrice_desktop">
            <span class="a-price aok-align-center">
              <span class="a-offscreen">$20.99</span>
              <span aria-hidden="true">
                <span class="a-price-symbol">$</span>
                <span class="a-price-whole">20</span>
                <span class="a-price-fraction">99</span>
              </span>
            </span>
            <span class="a-size-base a-color-price savingsPercentage">-9%</span>
          </div>
        </div>
        <div id="desktop_buybox" class="celwidget">
          <span class="a-price"><span class="a-offscreen">$20.99</span></span>
        </div>
        <div id="unrelated1" class="celwidget"></div>
        <div id="unrelated2" class="celwidget"></div>
        <div id="unrelated3" class="celwidget"></div>
        <div id="unrelated4" class="celwidget"></div>
        <div id="unrelated5" class="celwidget"></div>
        <div id="unrelated6" class="celwidget"></div>
        <div id="unrelated7" class="celwidget"></div>
        <div id="unrelated8" class="celwidget"></div>
        <div id="unrelated9" class="celwidget"><span class="a-price"><span class="a-offscreen">$1.00</span></span></div>
        <div id="unrelated10" class="celwidget"></div>
      </div>
    </main>
  </body>
</html>
