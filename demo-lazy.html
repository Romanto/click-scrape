<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lazy scroll feed — Click Scrape demo</title>
    <style>
      body {
        font: 16px/1.4 system-ui, sans-serif;
        margin: 0;
        background: #f6f7f9;
        color: #111;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #111;
        color: #fff;
        padding: 12px 20px;
      }
      header p {
        margin: 4px 0 0;
        opacity: 0.8;
        font-size: 13px;
      }
      #status {
        position: sticky;
        top: 56px;
        z-index: 2;
        background: #fff8e6;
        border-bottom: 1px solid #f0e0a8;
        padding: 8px 20px;
        font-size: 13px;
      }
      #feed {
        max-width: 520px;
        margin: 16px auto 80px;
        display: grid;
        gap: 12px;
        padding: 0 16px;
      }
      article.card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        min-height: 120px;
      }
      .title {
        font-weight: 700;
        font-size: 18px;
      }
      .price {
        margin-top: 8px;
        color: #047857;
        font-weight: 600;
      }
      #sentinel {
        height: 1px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Lazy scroll feed</strong>
      <p>Only a few cards mount at first; more append as you scroll (infinite scroll).</p>
    </header>
    <div id="status">Loaded 0 / 30</div>
    <div id="feed" class="products"></div>
    <div id="sentinel"></div>
    <script>
      const TOTAL = 30;
      const BATCH = 5;
      const feed = document.getElementById("feed");
      const status = document.getElementById("status");
      let nextIndex = 0;
      let loading = false;

      function cardHtml(i) {
        return (
          '<article class="card product">' +
          '<div class="title">Lazy Item ' +
          (i + 1) +
          "</div>" +
          '<div class="price">$' +
          (10 + i) +
          ".00</div>" +
          "</article>"
        );
      }

      function updateStatus() {
        status.textContent = "Loaded " + nextIndex + " / " + TOTAL;
      }

      function loadMore() {
        if (loading || nextIndex >= TOTAL) return;
        loading = true;
        setTimeout(function () {
          const end = Math.min(TOTAL, nextIndex + BATCH);
          let html = "";
          for (let i = nextIndex; i < end; i += 1) html += cardHtml(i);
          feed.insertAdjacentHTML("beforeend", html);
          nextIndex = end;
          updateStatus();
          loading = false;
          // Keep loading until the feed fills the viewport (otherwise scroll never fires).
          if (
            nextIndex < TOTAL &&
            document.body.offsetHeight <= window.innerHeight + 40
          ) {
            loadMore();
          }
        }, 180);
      }

      loadMore();
      window.addEventListener(
        "scroll",
        function () {
          const nearBottom =
            window.innerHeight + window.scrollY >= document.body.offsetHeight - 240;
          if (nearBottom) loadMore();
        },
        { passive: true }
      );
    </script>
  </body>
</html>
